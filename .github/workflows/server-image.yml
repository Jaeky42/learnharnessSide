name: Server image

# Builds the LearnHarness server image (Dockerfile; docs/cloud-sync.md) and
# publishes it to this fork's GitHub container registry:
#   side-tutor branch            → :latest  (alongside the desktop release)
#   cloud sync feature branch    → :dev     (for testing on the server)
# Servers follow one channel (deploy/.env LH_CHANNEL) and pull it nightly.
# Separate from side-tutor-windows.yml on purpose: it never creates a
# GitHub Release, so it can't change what installed desktop apps download.
on:
  push:
    branches: [side-tutor, claude/pensive-goldberg-7dty2m]
    paths-ignore:
      - "CLAUDE.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # Upstream 0.6.0: the core plugins' own dependencies (their tests and
      # the typecheck read them).
      - run: npm run plugins:setup
      - run: npm run typecheck
      # tests/obsidian-sync.test.ts drives the real Obsidian sync program
      # (obsidian-headless) against a stand-in for Obsidian's servers. It is
      # not a dependency of the app (the server installs it onto its volume,
      # deploy/docker-entrypoint.sh), so it is fetched here, at the same
      # pinned version, only for those tests.
      - name: Fetch the pinned Obsidian sync program for its tests
        run: |
          version="$(sed -n 's/^OB_VERSION="\(.*\)"$/\1/p' deploy/docker-entrypoint.sh)"
          test -n "$version"
          # The same command shape as the entrypoint: npm takes --allow-scripts
          # only on a global install.
          npm install -g --prefix "$RUNNER_TEMP/ob" --no-audit --no-fund --allow-scripts=better-sqlite3 "obsidian-headless@$version"
          test "$("$RUNNER_TEMP/ob/bin/ob" --version)" = "$version"
          echo "LH_TEST_OB_CLI=$RUNNER_TEMP/ob/lib/node_modules/obsidian-headless/cli.js" >> "$GITHUB_ENV"
      # Upstream's plugin SDK type tests (tests/plugin-*-types.test.ts) each run
      # the TypeScript compiler with a 30-second limit. Beside the fork's larger
      # suite on this runner one of them ran out of time, twice in a row. They
      # run on their own first, one at a time; nothing is skipped.
      - name: Plugin SDK type tests, on their own
        run: npx tsx --test --test-concurrency=1 tests/plugin-*types.test.ts
        env:
          NODE_ENV: test
      - name: Every other test
        run: |
          shopt -s nullglob
          files=()
          for f in tests/*.test.ts tests/*.test.tsx; do
            case "$f" in tests/plugin-*types.test.ts) ;; *) files+=("$f") ;; esac
          done
          echo "${#files[@]} test files"
          npx tsx --test "${files[@]}"
        env:
          NODE_ENV: test
      - run: npm run lint

  image:
    name: Build, smoke-test and publish
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Name and tag
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_NAME" = "side-tutor" ]; then channel=latest; else channel=dev; fi
          version="$(node -p "require('./package.json').version")+$(git rev-parse --short HEAD)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "$image:$channel ($version)"
      - name: Build
        run: |
          docker build \
            --build-arg LH_BUILD_VERSION="$VERSION" \
            --build-arg LH_BUILD_HOMEPAGE="https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$CHANNEL" -t "$IMAGE:$CHANNEL-${GITHUB_SHA::7}" .
      - name: Smoke-test the image
        run: |
          docker run -d --name lh -p 3000:3000 "$IMAGE:$CHANNEL"
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/setup && break
            sleep 2
          done
          docker logs lh
          # A fresh server asks for setup and prints a one-time code.
          docker logs lh 2>&1 | grep -q "Setup code: [0-9A-Z]\{4\}-[0-9A-Z]\{4\}" || { echo "::error::no setup code in the log"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/setup)" = "200" || { echo "::error::/setup is not served"; exit 1; }
          # Everything else is behind the login.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3000/)" = "http://127.0.0.1:3000/setup" || { echo "::error::/ is not redirected to /setup"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/settings)" = "401" || { echo "::error::an API answered without a login"; exit 1; }
          # The reset command exists and issues a new code.
          docker exec lh reset-password | grep -q "Setup code:" || { echo "::error::reset-password failed"; exit 1; }
          # Obsidian's sync program installs itself onto the volume at the
          # pinned version (cloud sync Phase 4), and its database add-on
          # loads on this image's Node.
          ob_version="$(sed -n 's/^OB_VERSION="\(.*\)"$/\1/p' deploy/docker-entrypoint.sh)"
          for i in $(seq 1 60); do
            [ "$(docker exec lh ob --version 2>/dev/null)" = "$ob_version" ] && break
            sleep 3
          done
          test "$(docker exec lh ob --version 2>/dev/null)" = "$ob_version" || { docker exec lh cat /data/home/ob-install.log || true; echo "::error::Obsidian's sync program was not installed"; exit 1; }
          docker exec lh node -e "new (require('/data/home/.local/lib/node_modules/obsidian-headless/node_modules/better-sqlite3'))(':memory:').close()" || { echo "::error::the sync program's database add-on does not load"; exit 1; }
          test "$(docker exec lh sh -c 'echo $LH_VAULT_DIR')" = "/data/vault" || { echo "::error::LH_VAULT_DIR is not set"; exit 1; }
          # The demo agent's browser: Chromium is where the checker looks for
          # it, starts as the app starts it (no display, the container's
          # user), and runs a page's script.
          docker exec lh test -x /usr/bin/chromium || { echo "::error::no Chromium in the image; demos can't be checked"; exit 1; }
          docker exec lh chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom 'data:text/html,<p id=o></p><script>document.getElementById("o").textContent=6*7</script>' | grep -q '<p id="o">42</p>' || { echo "::error::Chromium does not run a page in the image"; exit 1; }
          docker rm -f lh
      # Several accounts on one server (docs/multi-account-build.md, slice 6):
      # the real deploy/ stack (Caddy, the gateway, the maker, the owner's
      # copy) on the image just built, then the crossing tests: two accounts
      # made through the real invite flow, every way one could reach the
      # other refused. Only the local image is used: compose pulls Caddy and
      # nothing else (--pull missing), and no sandbox file is involved.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Multi-account stack and crossing tests
        run: |
          set -euo pipefail
          stack="$RUNNER_TEMP/stack"
          # The folder is the compose project's name ("stack", not "deploy" as on a server): the
          # stack must not depend on it (Caddy's default route; deploy/compose.yaml names its networks).
          cp -r deploy "$stack"
          cd "$stack"
          rm -f .env
          # The compose file names the fork's image; a fork of the fork builds it under its own name.
          docker tag "$IMAGE:$CHANNEL" "ghcr.io/jaeky42/learnharnessside:$CHANNEL"
          # As on a server: make-secrets.sh starts .env from .env.example (the runner is not root).
          ./make-secrets.sh
          sed -i -e 's/^LH_DOMAIN=.*/LH_DOMAIN=localhost/' -e "s/^LH_CHANNEL=.*/LH_CHANNEL=$CHANNEL/" .env
          cleanup() {
            [ -z "${listener:-}" ] || kill "$listener" 2>/dev/null || true
            # The optional host firewall, if this run installed it: the runner is left as it was.
            [ ! -f ./install-firewall.sh ] || sudo ./install-firewall.sh --remove >/dev/null 2>&1 || true
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
            for c in $(docker ps -aq --filter name='^lh-acct-'); do docker rm -f "$c" >/dev/null || true; done
            for n in $(docker network ls -q --filter name='^lh-acct-'); do docker network rm "$n" >/dev/null || true; done
            for v in $(docker volume ls -q --filter name='^lh-acct-'); do docker volume rm "$v" >/dev/null || true; done
          }
          trap cleanup EXIT
          # Caddy's networks and default route too: joining an account network must never move the route (deploy/compose.yaml, "fixed names").
          dump() { docker compose ps -a || true; docker inspect lh-caddy --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{$v.IPAddress}} priority {{$v.GwPriority}}{{"\n"}}{{end}}' || true; docker exec lh-caddy ip route || true; docker compose logs --no-color 2>&1 | sed -E 's/(Setup code: )[0-9A-Z-]+/\1<hidden>/' || true; for c in $(docker ps -aq --filter name='^lh-acct-'); do docker logs "$c" 2>&1 | tail -n 50 || true; done; sudo iptables -S 2>&1 | grep LH-FW || true; sudo iptables -S DOCKER-USER || true; systemctl status learnharness-firewall --no-pager || true; }
          docker compose up -d --pull missing
          for i in $(seq 1 60); do
            docker compose logs --no-log-prefix gateway 2>/dev/null | grep -q "Setup code: [0-9A-Z]\{4\}-[0-9A-Z]\{4\}" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker cp lh-caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt" 2>/dev/null && break
            sleep 2
          done
          for i in $(seq 1 60); do
            [ "$(curl -s --cacert "$RUNNER_TEMP/caddy-root.crt" -o /dev/null -w '%{http_code}' https://localhost/)" = "303" ] && break
            sleep 2
          done
          # The optional host firewall (install-firewall.sh), installed as on a server (the runner has
          # systemd and real Docker). A listener on the host that no container may reach; crossing.mjs
          # --firewall tries it, and GitHub's real metadata address, from inside two copies.
          fw_port=18765
          python3 -m http.server "$fw_port" --bind 0.0.0.0 >/dev/null 2>&1 &
          listener=$!
          for i in $(seq 1 20); do
            curl -s -o /dev/null "http://127.0.0.1:$fw_port/" && break
            sleep 0.5
          done
          curl -s -o /dev/null "http://127.0.0.1:$fw_port/" || { echo "::error::the host listener on port $fw_port doesn't answer from the host"; dump; exit 1; }
          # A TCP connect from inside the owner's copy (node; the image has no curl): to "gateway" (its
          # bridge's address on the host, from /proc/net/route) or an address. Prints connected,
          # ECONNREFUSED, timeout or another error code.
          probe='let h=process.argv[1];if(h==="gateway"){const r=require("fs").readFileSync("/proc/net/route","utf8").split("\n").map(l=>l.trim().split(/\s+/)).find(f=>f[1]==="00000000");h=r[2].match(/../g).reverse().map(x=>parseInt(x,16)).join(".")}const s=require("net").connect({host:h,port:+process.argv[2]});s.setTimeout(5000,()=>{console.log("timeout");s.destroy()});s.on("connect",()=>{console.log("connected");s.destroy()});s.on("error",e=>console.log(e.code))'
          probe_lh() { docker compose exec -T lh node -e "$probe" "$@" 2>&1 || true; }
          # Controls before the firewall: without it the host's port is open from a container, so its
          # refusal later is the firewall's.
          got="$(probe_lh gateway "$fw_port")"
          [ "$got" = "connected" ] || { echo "::error::before the firewall, the owner's copy could not reach the host's port $fw_port (got: $got); the firewall checks would prove nothing"; dump; exit 1; }
          got="$(probe_lh 169.254.169.254 80)"
          echo "Before the firewall, 169.254.169.254:80 from the owner's copy: $got"
          [ "$got" != "ECONNREFUSED" ] || echo "::warning::169.254.169.254:80 is already refused on this runner without the firewall; the metadata check proves nothing by its result alone (the rule counters below still must rise)"
          sudo ./install-firewall.sh || { echo "::error::install-firewall.sh refused or failed to install (its own message is above)"; dump; exit 1; }
          node test/crossing.mjs --base https://localhost --ca "$RUNNER_TEMP/caddy-root.crt" --compose-dir "$stack" --firewall --host-port "$fw_port" || { echo "::error::a crossing between accounts, or past the host firewall, was not refused (or the run could not finish)"; dump; exit 1; }
          # The refusals came from our rules: their counters rose (read before the restart, which resets them).
          counter() { { sudo iptables -w -nvxL "$1" || true; } | awk -v want="$2" '$3 == "REJECT" && /tcp-reset/ && $9 == want { n += $1 } END { print n + 0 }'; }
          meta_fwd="$(counter LH-FW-FORWARD-BR 169.254.0.0/16)"
          meta_in="$(counter LH-FW-INPUT-BR 169.254.0.0/16)"
          host_tcp="$(counter LH-FW-INPUT-BR 0.0.0.0/0)"
          echo "Firewall counters: metadata tcp-reset forwarded $meta_fwd, to the host $meta_in; the host's other TCP ports $host_tcp"
          [ "$((meta_fwd + meta_in))" -gt 0 ] || { echo "::error::the firewall's 169.254.0.0/16 rules refused nothing: the metadata refusal didn't come from them"; dump; exit 1; }
          [ "$host_tcp" -gt 0 ] || { echo "::error::the firewall's last TCP rule in LH-FW-INPUT-BR refused nothing: the host port's refusal didn't come from it"; dump; exit 1; }
          # After a Docker restart the start-up unit must put the rules back. One jump is taken out by
          # hand first, so only the unit can make --status pass again.
          sudo iptables -w -D INPUT -j LH-FW-INPUT
          sudo systemctl restart docker
          for i in $(seq 1 60); do
            [ "$(curl -s --cacert "$RUNNER_TEMP/caddy-root.crt" -o /dev/null -w '%{http_code}' https://localhost/)" = "303" ] && break
            sleep 2
          done
          [ "$(curl -s --cacert "$RUNNER_TEMP/caddy-root.crt" -o /dev/null -w '%{http_code}' https://localhost/)" = "303" ] || { echo "::error::the site did not answer again after a Docker restart"; dump; exit 1; }
          sudo ./install-firewall.sh --status || { echo "::error::after a Docker restart the firewall's rules were not all back: the start-up unit did not put them back"; dump; exit 1; }
          for i in $(seq 1 30); do
            [ -n "$(docker compose ps -q --status running lh)" ] && break
            sleep 2
          done
          got="$(probe_lh gateway "$fw_port")"
          [ "$got" = "ECONNREFUSED" ] || { echo "::error::after a Docker restart the owner's copy was not refused on the host's port $fw_port (got: $got)"; dump; exit 1; }
          sudo ./install-firewall.sh --remove
          left="$({ sudo iptables-save; sudo ip6tables-save 2>/dev/null || true; } | grep -c LH-FW || true)"
          [ "$left" = 0 ] || { echo "::error::install-firewall.sh --remove left $left LH-FW lines in the firewall"; sudo iptables-save | grep LH-FW || true; exit 1; }
          if sudo systemctl is-enabled learnharness-firewall >/dev/null 2>&1; then echo "::error::install-firewall.sh --remove left its start-up unit enabled"; exit 1; fi
          # And the route is open again: the listener was there all along.
          got="$(probe_lh gateway "$fw_port")"
          [ "$got" = "connected" ] || { echo "::error::after --remove the owner's copy still could not reach the host's port $fw_port (got: $got)"; dump; exit 1; }
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$CHANNEL"
          docker push "$IMAGE:$CHANNEL-${GITHUB_SHA::7}"
