name: Server image

# Builds the LearnHarness server image (Dockerfile; docs/cloud-sync.md) and
# publishes it to this fork's GitHub container registry:
#   side-tutor branch            → :latest  (alongside the desktop release)
#   cloud sync feature branch    → :dev     (for testing on the server)
# Servers follow one channel (deploy/.env LH_CHANNEL) and pull it nightly.
# Separate from side-tutor-windows.yml on purpose: it never creates a
# GitHub Release, so it can't change what installed desktop apps download.
on:
  push:
    branches: [side-tutor, claude/pensive-goldberg-7dty2m]
    paths-ignore:
      - "CLAUDE.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # Upstream 0.6.0: the core plugins' own dependencies (their tests and
      # the typecheck read them).
      - run: npm run plugins:setup
      - run: npm run typecheck
      # tests/obsidian-sync.test.ts drives the real Obsidian sync program
      # (obsidian-headless) against a stand-in for Obsidian's servers. It is
      # not a dependency of the app (the server installs it onto its volume,
      # deploy/docker-entrypoint.sh), so it is fetched here, at the same
      # pinned version, only for those tests.
      - name: Fetch the pinned Obsidian sync program for its tests
        run: |
          version="$(sed -n 's/^OB_VERSION="\(.*\)"$/\1/p' deploy/docker-entrypoint.sh)"
          test -n "$version"
          # The same command shape as the entrypoint: npm takes --allow-scripts
          # only on a global install.
          npm install -g --prefix "$RUNNER_TEMP/ob" --no-audit --no-fund --allow-scripts=better-sqlite3 "obsidian-headless@$version"
          test "$("$RUNNER_TEMP/ob/bin/ob" --version)" = "$version"
          echo "LH_TEST_OB_CLI=$RUNNER_TEMP/ob/lib/node_modules/obsidian-headless/cli.js" >> "$GITHUB_ENV"
      # Upstream's plugin SDK type tests (tests/plugin-*-types.test.ts) each run
      # the TypeScript compiler with a 30-second limit. Beside the fork's larger
      # suite on this runner one of them ran out of time, twice in a row. They
      # run on their own first, one at a time; nothing is skipped.
      - name: Plugin SDK type tests, on their own
        run: npx tsx --test --test-concurrency=1 tests/plugin-*types.test.ts
        env:
          NODE_ENV: test
      - name: Every other test
        run: |
          shopt -s nullglob
          files=()
          for f in tests/*.test.ts tests/*.test.tsx; do
            case "$f" in tests/plugin-*types.test.ts) ;; *) files+=("$f") ;; esac
          done
          echo "${#files[@]} test files"
          npx tsx --test "${files[@]}"
        env:
          NODE_ENV: test
      - run: npm run lint

  image:
    name: Build, smoke-test and publish
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Name and tag
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_NAME" = "side-tutor" ]; then channel=latest; else channel=dev; fi
          version="$(node -p "require('./package.json').version")+$(git rev-parse --short HEAD)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "$image:$channel ($version)"
      - name: Build
        run: |
          docker build \
            --build-arg LH_BUILD_VERSION="$VERSION" \
            --build-arg LH_BUILD_HOMEPAGE="https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$CHANNEL" -t "$IMAGE:$CHANNEL-${GITHUB_SHA::7}" .
      - name: Smoke-test the image
        run: |
          docker run -d --name lh -p 3000:3000 "$IMAGE:$CHANNEL"
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/setup && break
            sleep 2
          done
          docker logs lh
          # A fresh server asks for setup and prints a one-time code.
          docker logs lh 2>&1 | grep -q "Setup code: [0-9A-Z]\{4\}-[0-9A-Z]\{4\}" || { echo "::error::no setup code in the log"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/setup)" = "200" || { echo "::error::/setup is not served"; exit 1; }
          # Everything else is behind the login.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3000/)" = "http://127.0.0.1:3000/setup" || { echo "::error::/ is not redirected to /setup"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/settings)" = "401" || { echo "::error::an API answered without a login"; exit 1; }
          # The reset command exists and issues a new code.
          docker exec lh reset-password | grep -q "Setup code:" || { echo "::error::reset-password failed"; exit 1; }
          # Obsidian's sync program installs itself onto the volume at the
          # pinned version (cloud sync Phase 4), and its database add-on
          # loads on this image's Node.
          ob_version="$(sed -n 's/^OB_VERSION="\(.*\)"$/\1/p' deploy/docker-entrypoint.sh)"
          for i in $(seq 1 60); do
            [ "$(docker exec lh ob --version 2>/dev/null)" = "$ob_version" ] && break
            sleep 3
          done
          test "$(docker exec lh ob --version 2>/dev/null)" = "$ob_version" || { docker exec lh cat /data/home/ob-install.log || true; echo "::error::Obsidian's sync program was not installed"; exit 1; }
          docker exec lh node -e "new (require('/data/home/.local/lib/node_modules/obsidian-headless/node_modules/better-sqlite3'))(':memory:').close()" || { echo "::error::the sync program's database add-on does not load"; exit 1; }
          test "$(docker exec lh sh -c 'echo $LH_VAULT_DIR')" = "/data/vault" || { echo "::error::LH_VAULT_DIR is not set"; exit 1; }
          # The demo agent's browser: Chromium is where the checker looks for
          # it, starts as the app starts it (no display, the container's
          # user), and runs a page's script.
          docker exec lh test -x /usr/bin/chromium || { echo "::error::no Chromium in the image; demos can't be checked"; exit 1; }
          docker exec lh chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom 'data:text/html,<p id=o></p><script>document.getElementById("o").textContent=6*7</script>' | grep -q '<p id="o">42</p>' || { echo "::error::Chromium does not run a page in the image"; exit 1; }
          docker rm -f lh
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$CHANNEL"
          docker push "$IMAGE:$CHANNEL-${GITHUB_SHA::7}"
